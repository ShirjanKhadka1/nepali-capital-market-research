# =====================================================================
# NOT DEPLOYED — STAGED FILE ONLY (Phase 4, 7 Nov 2026).
# This workflow is NOT live on GitHub. It was prepared locally and has
# NOT been pushed via the API: the token behind the API helper lacks
# workflow scope, so an API push of a .github/workflows/ file would
# fail with 403. The parent deploys it via the GitHub web UI (browser
# route) and then confirms the file exists on main and the first run
# is observed green (or red, triaged honestly).
# Do NOT describe this workflow as deployed, running, or green until
# the parent confirms that deployment and a run.
#
# TARGET:
#   Repo:   ShirjanKhadka1/nepali-capital-market-research
#   Branch: main
#   Path:   .github/workflows/test.yml   (UPDATE — replaces the Phase 7 file)
#
# Change vs the live Phase 7 file: the quality job no longer runs only
# `ruff check scanner/`; it installs the pinned dev tools from
# requirements-dev.txt and runs `python scripts/qa.py`, the single
# Phase 4 entry point (tests, lint, counts, licence, secret scan, link
# check, fresh-clone smoke). Matrix and smoke jobs are unchanged.
# mypy is deliberately NOT run here: scanner/ uses a dual script/
# package import mode that mypy rejects (measured 28 Oct 2026).
# fetch-depth: 0 is deliberate: the secret gate scans `git log -p`,
# and the default shallow checkout would make that scan vacuous.
# =====================================================================
# Phase 7: OS x Python matrix + quality gate.
# Matrix job (pytest only) runs on Linux/macOS/Windows — the
# macos/windows combinations are CI-only: never run locally,
# their first GitHub run is the proof. Quality and smoke jobs
# stay on ubuntu-latest. mypy is deliberately NOT run here:
# scanner/ uses a dual script/package import mode that mypy
# rejects on package bases (measured 28 Oct 2026); ruff is
# the scanner's static gate. All CI dependencies pinned to
# versions measured 28 Oct 2026.
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "pytest==9.2.0"
      - run: python -m pytest scanner/tests/ -q
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/qa.py
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scanner/cli.py --csv scanner/examples/demo_prices.csv
